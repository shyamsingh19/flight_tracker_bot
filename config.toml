# Flight price alert settings. Secrets go in .env, not here.
# After editing, send /reload. The bot checks the file and replies with the new
# monthly cost estimate. If the file is invalid, the old settings stay active.
#
# Terms used below:
#   travel date   the date you asked for in /track
#   nearby dates  travel date ± flex_days

[search]                         # what every flight search asks for
market              = "IN"       # IN gives prices in rupees
currency            = "INR"      # results in any other currency are ignored
adults              = 1
cabin_class         = "economy"  # economy | premium_economy | business | first
max_stops           = 1          # a route can set its own with stops=
allow_self_transfer = false      # false = skip itineraries where you re-check bags yourself

[schedule]                       # when searches run (each search = 1 paid API call)
timezone            = "Asia/Kolkata"
active_hours        = "08-23"    # searches run only in these hours (end included); "00-23" = all day
tick_seconds        = 60         # how often the bot checks if a search is due (free)
anchor_every_min    = 60         # search the travel date every N minutes
buffer_scan_every_h = 24         # search nearby dates every N hours (24, 48…); 0 = only after a good deal
buffer_scan_at      = "08:00"    # time of day for the nearby-dates search
alt_watch_every_h   = 3          # re-check the cheapest nearby date every N hours; 0 = off
far_out_days        = 45         # trips more than this many days away…
far_out_slowdown    = 3          # …are searched this many times less often
min_interval_min    = 15         # no route can be searched more often than this

[route_defaults]                 # defaults for /track
flex_days           = 2          # nearby dates = travel date ± this many days
max_flex_days       = 7          # largest flex= /track accepts
burst_flex_days     = 5          # on a good deal, search ± this many days right away
burst_cooldown_h    = 12         # wait at least this long between those extra searches

[deal]                           # when an alert is sent
baseline_days       = 30         # "normal price" = prices seen in the last N days
good_percentile     = 25         # "good" = cheaper than 75% of those prices
great_percentile    = 10         # "great" = cheaper than 90%
min_samples         = 20         # no good/great labels until this many prices are stored
freshness_h         = 26         # prices older than this are left out of comparisons
drop_abs_inr        = 300        # "price dropped" alert: down by ₹300 AND 5%…
drop_pct            = 5
drop_window_h       = 24         # …compared with the lowest price in the last 24 h
alt_cheaper_abs_inr = 300        # "cheaper nearby date" alert: saves ₹300 or 5%, whichever is larger
alt_cheaper_pct     = 5
alt_realert_h       = 24         # alert about the same nearby date at most once per 24 h…
alt_realert_abs_inr = 100        # …unless the saving grows by another ₹100
realert_abs_inr     = 100        # repeat a good-deal or target alert only if it drops ₹100 AND 3% more
realert_pct         = 3
near_tie_inr        = 200        # a nearby date within ₹200 or 3% of the travel date
near_tie_pct        = 3          #   gets re-checked every alt_watch_every_h
recheck_unverified  = true       # search again to confirm a cached price before alerting
recheck_tolerance_pct = 2        # alert only if the second price is within 2% of the first
target_buffer_inr   = 300        # 🎯 alert when price ≤ your target + ₹300

[provider]                       # Ignav API connection
timeout_s           = 20         # give up on a request after this many seconds
retries             = 1          # retries on network or server errors (each retry is billed)
retry_backoff_s     = 2          # wait this long before retrying
backoff_on_429_min  = 60         # pause all searches this long after a rate-limit reply

[budget]
monthly_cap_inr     = 750        # monthly spending limit
hard_stop_pct       = 90         # stop all searches at 90% of the limit
warn_at_pct         = [50, 80, 100]  # send a message when spending crosses these %
usd_inr_effective   = 115        # ₹ per $ your card actually charges
ignav_usd_per_call  = 0.002
ignav_free_calls    = 1000       # free calls before billing starts; /status shows how many are left

[monitoring]
fail_notify_after   = 3          # send an error message after 3 failed searches in a row…
fail_notify_after_min = 60       # …or after 60 minutes of errors
fail_notify_cooldown_min = 60    # at most one error message per route per 60 minutes
daily_summary_at    = "08:30"
heartbeat_every_min = 30         # how often to ping HEARTBEAT_URL (if set in .env)
backup_at           = "02:00"    # nightly database backup
log_level           = "INFO"

[ui]
history_default_n   = 20         # prices shown by /history
search_results_n    = 5          # flights shown after a menu search
checknow_confirm_above_inr = 1   # /checknow asks first if it would cost more than this
